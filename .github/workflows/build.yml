name: Build and Push

on:
  push:
    branches: [master]

jobs:
  build:
    uses: rkamradt/ci-workflows/.github/workflows/site-image.yml@v1
    with:
      helm-chart-dir: javaman-client
      no-cache: true
      build-args: |
        VITE_KEYCLOAK_URL=${{ secrets.VITE_KEYCLOAK_URL }}
        VITE_KEYCLOAK_REALM=${{ secrets.VITE_KEYCLOAK_REALM }}
        VITE_KEYCLOAK_CLIENT_ID=${{ secrets.VITE_KEYCLOAK_CLIENT_ID }}
        VITE_API_URL=${{ secrets.VITE_API_URL }}
        VITE_GOOGLE_CLIENT_ID=${{ secrets.VITE_GOOGLE_CLIENT_ID }}
    secrets: inherit
